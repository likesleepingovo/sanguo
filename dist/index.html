<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三国时空历史地图</title>
    <link
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/assets/index-CIL5afXn.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BrmCXKdS.css">
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1 class="app-title">三国时空历史地图</h1>
        <nav class="mode-switch">
          <button id="mode-timeline" class="mode-btn active" data-mode="timeline">
            全局时空浏览
          </button>
          <button id="mode-battle" class="mode-btn" data-mode="battle">
            战役推演沙盘
          </button>
        </nav>
      </header>

      <aside id="sidebar" class="sidebar">
        <section class="sidebar-section">
          <h2>事件目录</h2>
          <ul id="event-list" class="event-list"></ul>
        </section>
        <section class="sidebar-section battle-panel hidden" id="battle-panel">
          <h2>战役阶段</h2>
          <select id="battle-select" class="battle-select"></select>
          <div id="battle-text" class="battle-text"></div>
          <div class="battle-controls">
            <button id="battle-play" class="ctrl-btn" title="播放">▶</button>
            <button id="battle-pause" class="ctrl-btn" title="暂停">⏸</button>
            <button id="battle-step" class="ctrl-btn" title="步进">⏭</button>
          </div>
        </section>
      </aside>

      <main class="map-container">
        <div id="map"></div>

        <div id="layer-control" class="layer-control panel">
          <h3>图层控制</h3>
          <label><input type="checkbox" data-layer="cities" checked /> 城池点位</label>
          <label><input type="checkbox" data-layer="rivers" checked /> 水系</label>
          <label><input type="checkbox" data-layer="factions" checked /> 势力边界</label>
          <label><input type="checkbox" data-layer="routes" checked /> 行军路线</label>
        </div>

        <div id="city-panel" class="city-panel panel hidden">
          <button id="city-panel-close" class="panel-close">×</button>
          <h3 id="city-name"></h3>
          <p id="city-desc"></p>
          <dl id="city-meta"></dl>
        </div>

        <div id="measure-info" class="measure-info panel hidden">
          <span id="measure-distance">0 km</span>
          <button id="measure-clear" class="ctrl-btn small">清除</button>
        </div>

        <button id="measure-toggle" class="measure-toggle" title="测距工具">📏</button>
      </main>

      <footer class="timeline-bar" id="timeline-bar">
        <div class="timeline-header">
          <span class="timeline-year" id="current-year">184</span>
          <span class="timeline-label">年</span>
        </div>
        <div class="timeline-track-wrap">
          <input
            type="range"
            id="timeline-slider"
            class="timeline-slider"
            min="184"
            max="280"
            value="184"
            step="1"
          />
          <div id="timeline-marks" class="timeline-marks"></div>
        </div>
      </footer>
    </div>
  </body>
</html>
